name: Deploy AWS app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lostark
          POSTGRES_PASSWORD: lostark_ci
          POSTGRES_DB: lostark_party_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lostark -d lostark_party_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lostark:lostark_ci@localhost:5432/lostark_party_ci
      APP_BASE_URL: http://localhost:3000
      APP_DOMAIN: localhost
      SESSION_SECRET: github-actions-session-secret
      DISCORD_REDIRECT_URI: http://localhost:3000/api/discord/oauth/callback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Verify image archive validation
        run: python3 -m unittest discover -s tests/deployment -p '*_test.py'

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-aws:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate existing deploy credentials
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          AWS_BOOTSTRAP_USER: ${{ secrets.AWS_BOOTSTRAP_USER }}
          AWS_BOOTSTRAP_SSH_KEY: ${{ secrets.AWS_BOOTSTRAP_SSH_KEY }}
        run: |
          for key in TS_AUTHKEY AWS_BOOTSTRAP_USER AWS_BOOTSTRAP_SSH_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required deploy credential: ${key}"
              exit 1
            fi
          done

      - name: Build immutable app image
        run: |
          mkdir bundle
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "lostark-party-app:${GITHUB_SHA}" .
          docker image inspect --format '{{.Id}}' "lostark-party-app:${GITHUB_SHA}" > bundle/ci-image-id.txt
          docker image inspect --format '{{.Size}}' "lostark-party-app:${GITHUB_SHA}" > bundle/image-size.txt
          docker save "lostark-party-app:${GITHUB_SHA}" | gzip > bundle/image.tar.gz
          (cd bundle && sha256sum image.tar.gz > image.tar.gz.sha256)
          python3 scripts/verify-app-image.py bundle/image.tar.gz "${GITHUB_SHA}" > bundle/image-config-digest.txt
          find prisma -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > bundle/prisma.sha256
          cp deploy/app-only.compose.yml scripts/deploy-aws-app.sh scripts/verify-app-image.py bundle/

      - name: Retain deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: lostark-aws-${{ github.sha }}
          path: bundle/
          retention-days: 1

      - name: Connect to existing tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy app services over authenticated private SSH
        env:
          AWS_BOOTSTRAP_USER: ${{ secrets.AWS_BOOTSTRAP_USER }}
          AWS_BOOTSTRAP_SSH_KEY: ${{ secrets.AWS_BOOTSTRAP_SSH_KEY }}
        run: |
          [[ "${AWS_BOOTSTRAP_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          ip="$(tailscale ip -4 lostark-party-aws | head -n 1)"
          [[ "$ip" =~ ^100[.][0-9]+[.][0-9]+[.][0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AWS_BOOTSTRAP_SSH_KEY}" > ~/.ssh/aws-deploy.pem
          chmod 600 ~/.ssh/aws-deploy.pem
          ssh_args=(-i ~/.ssh/aws-deploy.pem -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=yes -o HostKeyAlias=lostark-party-aws -o "UserKnownHostsFile=$GITHUB_WORKSPACE/deploy/aws.known_hosts")
          target="${AWS_BOOTSTRAP_USER}@$ip"
          remote="/tmp/lostark-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          available="$(ssh "${ssh_args[@]}" "$target" 'df -PB1 /opt/lostark-party' | awk 'NR==2 {print $4}')"
          image_size="$(cat bundle/image-size.txt)"
          [[ "$available" =~ ^[0-9]+$ && "$image_size" =~ ^[0-9]+$ ]]
          required="$(( $(stat -c %s bundle/image.tar.gz) + image_size * 2 + 536870912 ))"
          if [ "$available" -lt "$required" ]; then
            echo "::error::Insufficient disk space for image load and rollback"
            exit 1
          fi
          ssh "${ssh_args[@]}" "$target" "mkdir -p '$remote' && chmod 700 '$remote'"
          scp "${ssh_args[@]}" bundle/* "$target:$remote/"
          ssh "${ssh_args[@]}" "$target" "sudo -n bash '$remote/deploy-aws-app.sh' '${GITHUB_SHA}'"

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/aws-deploy.pem
