name: Build AWS app artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  test:
    needs: ["security"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lostark
          POSTGRES_PASSWORD: lostark_ci
          POSTGRES_DB: lostark_party_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lostark -d lostark_party_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lostark:lostark_ci@localhost:5432/lostark_party_ci
      APP_BASE_URL: http://localhost:3000
      APP_DOMAIN: localhost
      SESSION_SECRET: github-actions-session-secret
      DISCORD_REDIRECT_URI: http://localhost:3000/api/discord/oauth/callback
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Verify image archive validation
        run: python3 -m unittest discover -s tests/deployment -p '*_test.py'

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  publish-aws:
    needs: ["security", "test"]
    if: "${{ needs.security.result == 'success' && (github.ref == 'refs/heads/main' && github.event_name == 'push') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Build immutable app image
        run: |
          mkdir bundle
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "lostark-party-app:${GITHUB_SHA}" .
          docker image inspect --format '{{.Id}}' "lostark-party-app:${GITHUB_SHA}" > bundle/ci-image-id.txt
          docker image inspect --format '{{.Size}}' "lostark-party-app:${GITHUB_SHA}" > bundle/image-size.txt
          docker save "lostark-party-app:${GITHUB_SHA}" | gzip > bundle/image.tar.gz
          (cd bundle && sha256sum image.tar.gz > image.tar.gz.sha256)
          python3 scripts/verify-app-image.py bundle/image.tar.gz "${GITHUB_SHA}" > bundle/image-config-digest.txt
          find prisma -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > bundle/prisma.sha256
          cp deploy/app-only.compose.yml scripts/deploy-aws-app.sh scripts/verify-app-image.py bundle/

      - name: Retain deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lostark-aws-${{ github.sha }}
          path: bundle/
          retention-days: 7
