services:
  web:
    image: ${LOSTARK_RELEASE_IMAGE:?set LOSTARK_RELEASE_IMAGE}
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3000"]
  worker:
    image: ${LOSTARK_RELEASE_IMAGE:?set LOSTARK_RELEASE_IMAGE}
    command: ["npm", "run", "worker:notifications"]
  character-worker:
    image: ${LOSTARK_RELEASE_IMAGE:?set LOSTARK_RELEASE_IMAGE}
    command: ["npm", "run", "worker:characters"]
